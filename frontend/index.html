<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legit HealthCare Management System</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LegitHC" />
    <script>
      (function() {
        // Resolve Manifest URL early and statically to prevent 'Install' button flickering
        // Vite replaces %VITE_API_URL% at build time
        const viteApi = "%VITE_API_URL%";
        const manifestUrl = (viteApi && !viteApi.startsWith('%')) ? viteApi + '/api/branding/manifest.json' : '/api/branding/manifest.json';
        
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.id = 'pwa-manifest';
        link.href = manifestUrl;
        // Critical for cross-domain PWA installation
        if (manifestUrl.startsWith('http')) link.setAttribute('crossorigin', 'use-credentials');
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
