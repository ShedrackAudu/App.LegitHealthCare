<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legit HealthCare Management System</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LegitHC" />
    <link rel="manifest" href="/api/branding/manifest.json" />
    <script>
      // Early manifest resolution to prevent PWA install button flickering on refresh
      (function() {
        const apiBase = "%VITE_API_URL%";
        // Use local path if placeholder remains or if we are on localhost
        const isPlaceHolder = apiBase === ("%" + "VITE_API_URL" + "%") || !apiBase;
        const url = (!isPlaceHolder && apiBase.indexOf('localhost') === -1)
          ? apiBase + '/api/branding/manifest.json'
          : '/api/branding/manifest.json';
        
        const link = document.querySelector('link[rel="manifest"]');
        if (link && link.getAttribute('href') !== url) {
          link.href = url;
          if (url.indexOf('http') === 0) link.crossOrigin = 'anonymous';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
