<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legit HealthCare Management System</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LegitHC" />
    <!--
      Primary manifest: the static /manifest.webmanifest generated by vite-pwa.
      This is served from the same origin as the frontend so no CORS issues,
      and is ALWAYS available (even offline after SW caches it).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /**
       * Dynamic clinic branding manifest upgrade.
       *
       * Vite replaces %VITE_API_URL% in HTML attribute values at build time,
       * but NOT inside <script> tag bodies. We therefore use a data attribute
       * trick: Vite will replace the value in the data attribute, and the
       * script reads it at runtime. This is the only reliable way to pass
       * build-time env vars into an inline HTML script.
       *
       * If VITE_API_URL is set to a production backend URL (e.g. Render),
       * we swap the manifest link to the dynamic clinic manifest AFTER the
       * browser has already seen the static one. This way:
       *   1. PWA installability is never blocked (static manifest always loads first).
       *   2. Clinic branding (custom name/icon) is applied when available.
       */
      (function() {
        var el = document.getElementById('__pwa_api_base__');
        var apiBase = el ? el.getAttribute('data-api-base') : '';
        
        // If Vite didn't replace the placeholder, it remains as the literal string
        var isUnresolved = apiBase === '%VITE_API_URL%';
        var isLocalhost = !apiBase || isUnresolved || apiBase.indexOf('localhost') !== -1 || apiBase.indexOf('127.0.0.1') !== -1;

        if (!isLocalhost && apiBase) {
          var dynamicManifestUrl = apiBase + '/api/branding/manifest.json';
          var link = document.querySelector('link[rel="manifest"]');
          if (link) {
            link.setAttribute('href', dynamicManifestUrl);
            link.setAttribute('crossorigin', 'anonymous');
          }
        }
      })();

      // Global capture for PWA install prompt to prevent missing the event before React mounts
      window.deferredPWAPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAPrompt = e;
        // Dispatch custom event to notify React if it's already mounted
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPWAPrompt = null;
      });
    </script>
    <span id="__pwa_api_base__" data-api-base="%VITE_API_URL%" style="display:none" aria-hidden="true"></span>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
